# Paths are relative to this file. No credentials are read by inspect/status.
light_config = "../config.toml"
output_dir = "../runs/tracer"

[pipeline]
collect_workers = 6
start_workers = 2
compare_workers = 2
llm_workers = 2
max_inflight = 12
max_unremoved_containers = 8
max_local_attempts = 2
docker_retry_seconds = 10
min_free_disk_mb = 1024

[trace]
wall_seconds = 30
startup_seconds = 45
max_events = 20000
max_trace_bytes = 33554432
max_event_bytes = 131072
max_depth = 5
max_items = 128
max_nodes = 2048
max_string_bytes = 2048
max_snapshot_bytes = 65536

[analysis]
# Optional stage; requires run --paid and a positive --max-requests.
model = "deepseek-v4-pro"
max_tokens = 4096
max_material_bytes = 100000
max_evidence_events = 40
max_differences = 100
